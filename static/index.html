<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>やりたいことリスト</title>
</head>
<body>
    <h1>やりたいことリスト</h1>

    <input type="text" id="titleInput" placeholder="やりたいことを入力">
    <button onclick="addGoal()">追加</button>

    <ul id="goalList"></ul>

    <script>
        async function fetchGoals() {
            const response = await fetch("/goals");
            const goals = await response.json();
            const list = document.getElementById("goalList");
            list.innerHTML = "";

            goals.forEach(goal => {
                const li = document.createElement("li");

                const span = document.createElement("span");
                span.textContent = goal.title;
                if (goal.achieved) {
                    span.style.textDecoration = "line-through";
                    span.style.color = "gray";
                }
                li.appendChild(span);

                const achieveBtn = document.createElement("button");
                achieveBtn.textContent = "達成!";
                achieveBtn.onclick = () => achieveGoal(goal.id);
                li.appendChild(achieveBtn);

                const deleteBtn = document.createElement("button");
                deleteBtn.textContent = "削除";
                deleteBtn.onclick = () => deleteGoal(goal.id);
                li.appendChild(deleteBtn);

                list.appendChild(li);
            });
        }

        async function addGoal() {
            const input = document.getElementById("titleInput");
            const title = input.value;
            if (!title) return;

            await fetch(`/goals?title=${encodeURIComponent(title)}`, {
                method: "POST"
            });

            input.value = "";
            fetchGoals();
        }

        async function achieveGoal(id) {
            await fetch(`/goals/${id}/achieve`, {
                method: "PATCH"
            });
            fetchGoals();
        }

        async function deleteGoal(id) {
            await fetch(`/goals/${id}`, {
                method: "DELETE"
            });
            fetchGoals();
        }

        fetchGoals();
    </script>
</body>
</html>
